<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪纸帕秋莉 样张</title>
<style>
@font-face { font-family: WenKai; src: url(fonts/LXGWWenKai-Regular.ttf); font-display: block; }
html, body { margin: 0; background: #d9d0bf; color: #221c26; font: 15px/1.4 WenKai, KaiTi, serif; }
canvas { display: block; margin: 0 auto 16px; max-width: 100%; }
#nav { padding: 8px 16px; } #nav a { color: #6d5d8c; margin-right: 12px; }
</style>
</head>
<body>
<!-- 开发用样张页：?sheet=poses|moods|stage（默认全部），?t=秒 固定时间（不传则动画播放），?dots 画出返回的锚点，?mood= ?mouth= 调试 -->
<div id="nav">样张：<a href="?sheet=poses">全部姿势</a><a href="?sheet=moods">表情</a><a href="?sheet=stage">构图</a><a href="?">全部</a> · <a href="?sheet=poses&dots">锚点</a></div>
<div id="wrap"></div>
<script src="src/core.js"></script>
<script src="src/kit.js"></script>
<script src="src/character/patchouli.js"></script>
<script>
// core.js 的 Q 是 URL 参数
const chDots = Q.has('dots');
function chPaper(c, w, h) { c.fillStyle = P.paper; c.fillRect(0, 0, w, h); grain(c, polyPath(rectPts(0, 0, w, h)), .12); }
function chMarks(c, r) {
  if (!chDots || !r) return;
  const dot = (p, col) => { if (!p) return; c.fillStyle = col; c.beginPath(); c.arc(p[0], p[1], 5, 0, TAU); c.fill(); };
  dot(r.head, P.red); r.hands.forEach(p => dot(p, P.green)); dot(r.book, P.blue); dot(r.tip, P.gold);
}
const CH_SHEETS = {
  // 全部 pose 一排（同一比例 h=440）
  poses: { w: 2760, h: 720, draw(c, t) {
    chPaper(c, 2760, 720);
    const list = [['stand', 'normal'], ['lecture', 'normal'], ['point', 'smug'], ['hide', 'flustered'], ['cross', 'pout'], ['sit', 'smile'], ['peek', 'normal'], ['tired', 'sleepy'], ['lift', 'annoyed'], ['lie', 'sleepy']];
    const base = 600, hh = 440;
    list.forEach(([p, m], i) => {
      const x = 150 + i * 250 + (p === 'lie' ? 170 : 0);
      rline(c, [[x - 115 - (p === 'lie' ? 150 : 0), base], [x + 115 + (p === 'lie' ? 150 : 0), base]], { w: 3, color: P.ink2, seed: i + 3 });
      const o = { x, y: base, h: hh, pose: p, mood: m, t: t + i * .37, blink: p === 'lie' ? 1 : blinkAt(t, i + 1), mouth: p === 'lecture' ? mouthAt(t % 3, { t0: 0, t1: 3, text: '今天讲调理身体' }) : 0 };
      if (p === 'sit') o.y = base - 100;
      if (p === 'sit') rline(c, [[x - 110, base - 100], [x + 110, base - 100]], { w: 3, color: P.ink2, seed: 40 });
      if (p === 'peek') { o.y = base - 160; rline(c, [[x - 110, base - 160], [x + 110, base - 160]], { w: 3, color: P.ink2, seed: 41 }); }
      const r = drawPatchouli(c, o); chMarks(c, r);
      zh(c, p + ' · ' + m, x, base + 60, { size: 28, align: 'center', color: P.ink2 });
    });
  } },
  // 头部放大（约 500px 高）的全部表情
  moods: { w: 1800, h: 1260, draw(c, t) {
    chPaper(c, 1800, 1260);
    const moods = ['normal', 'smug', 'pout', 'flustered', 'annoyed', 'sleepy', 'surprised', 'smile'], mo = +(Q.get('mouth') || 0);
    moods.forEach((m, i) => { const cx = 225 + (i % 4) * 450, top = 20 + Math.floor(i / 4) * 620, hh = 1226;
      c.save(); c.beginPath(); c.rect(cx - 225, top, 450, 560); c.clip();
      drawPatchouli(c, { x: cx, y: top + 30 + 1221, h: hh, pose: 'stand', mood: m, t, mouth: mo, blink: Q.has('t') ? 0 : blinkAt(t, i + 2) });
      c.restore();
      zh(c, m, cx, top + 598, { size: 30, align: 'center', color: P.ink2 }); });
  } },
  // 开发用：几个姿势放大看（?poses=a,b,c&moods=x,y,z）
  zoom: { w: 1800, h: 1000, draw(c, t) {
    chPaper(c, 1800, 1000);
    const ps = (Q.get('poses') || 'stand,lecture,cross,hide').split(','), ms = (Q.get('moods') || '').split(',');
    ps.forEach((p, i) => { const x = 1800 / ps.length * (i + .5), y = p === 'peek' ? 700 : p === 'sit' ? 780 : 960;
      rline(c, [[x - 200, y], [x + 200, y]], { w: 3, color: P.ink2, seed: i + 3 });
      const r = drawPatchouli(c, { x: p === 'lie' ? x - 60 : x, y, h: 880, pose: p, mood: ms[i] || 'normal', t, blink: p === 'lie' ? 1 : 0, mouth: +(Q.get('mouth') || 0) }); chMarks(c, r); });
  } },
  // 示例构图：书页上她站在页边，另一边一条墨线曲线
  stage: { w: 1920, h: 1080, draw(c, t) {
    paperBg(c);
    rline(c, [[110, 900], [1810, 900]], { w: 4, color: P.ink, seed: 5 });
    const pts = []; for (let k = 0; k <= 60; k++) { const u = k / 60; pts.push([760 + u * 980, 700 - 330 * Math.sin(u * Math.PI * 1.5) * Math.exp(-u * .9) - 40 * u]); }
    rline(c, pts, { w: 5, color: P.ink, seed: 9, smooth: true });
    zh(c, '23 点', 1280, 250, { size: 64, color: P.ink });
    const mood = Q.get('mood') || 'normal', pose = Q.get('pose') || 'lecture';
    const cur = { t0: 0, t1: 3, text: '熬夜的代价，是第二天的你。' };
    const r = drawPatchouli(c, { x: 400, y: 900, h: 520, pose, mood, t, gesture: .55 + .45 * Math.sin(t * 1.4) ** 2, mouth: mouthAt(t % 3.5, cur), blink: blinkAt(t) });
    chMarks(c, r);
    caption(c, '第一页 · 睡眠', 10, 0);
    zh(c, '熬夜的代价，是第二天的你。', 960, 1000, { size: 42, align: 'center', color: P.ink });
    handFrame(c, 0);
  } },
};
const chSel = Q.get('sheet'), chFixed = Q.has('t') ? +Q.get('t') : null, chList = chSel ? [chSel] : Object.keys(CH_SHEETS);
const chCvs = chList.map(k => { const cv = document.createElement('canvas'), S = CH_SHEETS[k]; cv.width = S.w; cv.height = S.h; cv.id = 'sheet-' + k; cv.style.width = Math.min(S.w, 1600) + 'px'; document.getElementById('wrap').appendChild(cv); return [cv.getContext('2d'), S]; });
function chDraw(t) { for (const [c, S] of chCvs) { c.save(); S.draw(c, t); c.restore(); } }
window.__chDraw = chDraw;
// 性能：画一次 drawPatchouli 的平均毫秒（1920×1080 画布，h=520）
window.__chBench = n => { const cv = document.createElement('canvas'); cv.width = 1920; cv.height = 1080; const c = cv.getContext('2d'); const poses = ['stand', 'lecture', 'point', 'hide', 'cross', 'sit', 'peek', 'tired', 'lift', 'lie'], out = {};
  for (const p of poses) { const t0 = performance.now(); for (let i = 0; i < n; i++) drawPatchouli(c, { x: 900, y: 900, t: i / 30, mouth: .5, pose: p, mood: i % 2 ? 'pout' : 'normal' }); out[p] = +((performance.now() - t0) / n).toFixed(2); }
  c.getImageData(0, 0, 1, 1); return out; };
document.fonts.load(`40px ${ZH}`, '帕秋莉哼').then(() => document.fonts.ready).then(start, start);
function start() {
  if (chFixed !== null) { chDraw(chFixed); window.__ready = true; return; }
  const t0 = performance.now(); const loop = () => { chDraw((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); window.__ready = true;
}
</script>
</body>
</html>
