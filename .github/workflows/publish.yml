# 唯一的一条 CI：构建单文件页面。
#   推到 main → 部署 GitHub Pages（仓库 Settings → Pages 的 Source 要选 GitHub Actions）
#   推 v* 标签 → 另外逐帧渲染 1080p MP4，一起发到 Release
name: build & publish
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install fonttools brotli
      - run: npm ci
      - run: node tools/build.mjs
      - name: render mp4 (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          npx playwright install --with-deps chromium
          node tools/render.mjs --jobs 4
          cp dist/index.html patchouli-lecture-1.html
      - name: release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: docs/release-notes.md
          files: |
            patchouli-lecture-1.html
            out/patchouli-lecture-1.mp4
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
